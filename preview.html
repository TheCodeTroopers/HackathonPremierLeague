              blue: '#2563EB',
              indigo: '#3730A3',
              navy: '#1E1B4B',

  <!-- Google Fonts for Comic Brush / Hand-Drawn Display Art -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">

  <!-- React 18 & Babel for instant browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- GSAP, ScrollTrigger & Anime.js for Comic Entrance & Scroll Animations -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    @media (pointer: fine) {
      *, *::before, *::after, html, body, a, button, input, select, textarea, [role="button"], .cursor-pointer {
        cursor: none !important;
      }
    }
    body {
      background-color: #FBF9F2;
      color: #1E1B4B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }
    .font-marker {
      font-family: 'Permanent Marker', cursive, sans-serif;
    }
    /* Kinetic Animations */
    @keyframes marqueeSlow { 0%{transform:translateX(0%)} 100%{transform:translateX(-50%)} }
    @keyframes textGlowOrange { 0%,100%{text-shadow:2px 2px 0 #1E1B4B,0 0 10px rgba(234,88,12,.2)} 50%{text-shadow:3px 3px 0 #1E1B4B,0 0 22px rgba(234,88,12,.45)} }
    @keyframes textGlowPurple { 0%,100%{text-shadow:2px 2px 0 #1E1B4B,0 0 10px rgba(79,70,229,.2)} 50%{text-shadow:3px 3px 0 #1E1B4B,0 0 22px rgba(79,70,229,.45)} }
    @keyframes floatSlow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    .animate-marquee { display:flex; width:200%; animation:marqueeSlow 28s linear infinite; }
    .animate-marquee:hover { animation-play-state:paused; }
    .animate-glow-orange { animation:textGlowOrange 3s ease-in-out infinite; }
    .animate-glow-purple { animation:textGlowPurple 3s ease-in-out infinite; }
    .sketch-border { border: 2px solid #1E1B4B; }
    .sketch-border-thick { border: 3px solid #1E1B4B; }
    .shadow-sketch { box-shadow: 4px 4px 0px #1E1B4B; }
    .shadow-sketch-sm { box-shadow: 2px 2px 0px #1E1B4B; }
    .shadow-sketch-lg { box-shadow: 6px 6px 0px #1E1B4B; }
    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-track { background: #FBF9F2; border-left: 2px solid #1E1B4B; }
    ::-webkit-scrollbar-thumb { background: #1E1B4B; border-radius: 4px; }

</head>
<body class="selection:bg-amber-400 selection:text-ink min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PREVIEW_PILLARS = [
      { number: '01', title: 'THE IDEA', subtitle: 'Why a Premier League?', emoji: '💡', desc: 'Traditional 24-hour hackathons reward hasty hacks. HPL turns innovation into a premier 3-week league where solutions evolve through real engineering sprints.', points: ['3 progressive match weeks instead of overnight crunch', 'Head-to-head match fixtures for real problem-solving', 'Alignment with regional & municipal challenges'] },
      { number: '02', title: 'THE SQUADS', subtitle: 'Cross-Disciplinary Powerhouses', emoji: '👥', desc: 'Squads assemble with 3 to 4 specialized builders: backend, frontend, AI/ML, and product presentation.', points: ['Balanced 5 member squads across technology disciplines', 'Official squad badges, numbers, and team repos', 'Assigned mentor advisors for each challenge track'] },
      { number: '03', title: 'THE MATCHES', subtitle: 'Head-to-Head Showdowns', emoji: '⚔️', desc: 'Every week features official Match Days. Squads face off against peer teams, presenting working software demos.', points: ['Win: +3 Points | Tie: +1 Point | Loss: 0 Points', 'Live demo battles judged on code quality & UX', 'Real-time points allocation to the public leaderboard'] },
      { number: '04', title: 'THE FEEDBACK', subtitle: 'Iterate & Engineer', emoji: '💬', desc: 'After every match day, squads receive detailed technical critiques. Week 2 introduces a surprise requirement.', points: ['1-on-1 mentor office hours and code reviews', 'Feature twists testing modularity and clean abstractions', 'Continuous improvement rewarded over static prototypes'] },
      { number: '05', title: 'THE RANKINGS', subtitle: 'Climb the Table', emoji: '📈', desc: 'The live leaderboard updates dynamically after every evaluation round based on cumulative match points.', points: ['Dynamic table tracking Wins, Ties, Losses, and Points', 'Movement indicators (↑ Rising, → Stable, ↓ Falling)', 'Top 4 squads qualify for the Physical Grand Playoffs'] },
      { number: '06', title: 'THE PLAYOFFS', subtitle: 'Knockout Arena', emoji: '🏟️', desc: 'The Top 4 ranked squads enter the playoff stadium for high-stakes semifinal and championship showdowns.', points: ['Physical arena sprint at SMVITM Bantakal Auditorium', 'Live code stress tests and jury cross-examinations', 'Bronze 3rd-place match and Championship Grand Finale'] },
      { number: '07', title: 'THE CHAMPION', subtitle: 'Trophy & Legacy', emoji: '🏆', desc: 'The Grand Champion lifts the golden HPL Trophy, claims ₹30,000+ cash prize pool, and secures incubation.', points: ['Official Golden HPL Champion Trophy & Medals', '₹30K prize pool and cloud infrastructure credits', 'Direct angel incubation and tech internship fast-tracks'] }
    ];

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [loadingProgress, setLoadingProgress] = useState(0);
      const [activePage, setActivePage] = useState('home');
      const [selectedWeek, setSelectedWeek] = useState(1);
      const [pillarIdx, setPillarIdx] = useState(0);
      const selectedPillar = PREVIEW_PILLARS[pillarIdx];

      useEffect(() => {
        const interval = setInterval(() => {
          setLoadingProgress(prev => {
            if (prev >= 100) {
              clearInterval(interval);
              setTimeout(() => setIsLoading(false), 450);
              return 100;
            }
            return Math.min(100, prev + 1.6);
          });
        }, 32);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const runScrollAnimations = () => {
          if (window.gsap && window.ScrollTrigger) {
            window.gsap.registerPlugin(window.ScrollTrigger);
            window.gsap.fromTo('.scroll-bento-card', 
              { y: 55, opacity: 0, scale: 0.9 },
              {
                scrollTrigger: { trigger: '#about', start: 'top 82%', toggleActions: 'play reverse play reverse' },
                y: 0, opacity: 1, scale: 1, stagger: 0.15, duration: 0.7, ease: 'back.out(1.6)'
              }
            );
            window.gsap.fromTo('.scroll-journey-card',
              { y: 50, opacity: 0, scale: 0.85 },
              {
                scrollTrigger: { trigger: '#journey', start: 'top 80%', toggleActions: 'play reverse play reverse' },
                y: 0, opacity: 1, scale: 1, stagger: 0.18, duration: 0.75, ease: 'back.out(1.7)'
              }
            );
          }
        };
        const timer = setTimeout(runScrollAnimations, 100);
        return () => clearTimeout(timer);
      }, []);

      // Determine stage text for preview
      let stageTxt = 'INITIALIZING THE LEAGUE...';
      let stageDot = '#6366F1';
      if (loadingProgress >= 10 && loadingProgress < 30) {
        stageTxt = 'ASSEMBLING THE CHAMPIONSHIP...';
        stageDot = '#D97706';
      } else if (loadingProgress >= 30 && loadingProgress < 50) {
        stageTxt = 'BUILDING THE LEAGUE...';
        stageDot = '#4F46E5';
      } else if (loadingProgress >= 50 && loadingProgress < 70) {
        stageTxt = 'PREPARING MATCH DAY...';
        stageDot = '#EA580C';
      } else if (loadingProgress >= 70 && loadingProgress < 90) {
        stageTxt = 'CALLING THE SQUADS...';
        stageDot = '#059669';
      } else if (loadingProgress >= 90) {
        stageTxt = 'THE LEAGUE BEGINS.';
        stageDot = '#E11D48';
      }

      return (
        <div className="min-h-screen flex flex-col justify-between relative">
          {/* Detailed Loading Screen Matching User Specification */}
          {isLoading && (
            <div className="fixed inset-0 z-[9999] bg-[#FAF6EE] flex flex-col items-center justify-between p-6 select-none transition-all duration-500 overflow-hidden">
              <div className="w-full max-w-xl flex flex-col items-center gap-3">
                <div className="w-full flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full animate-ping" style={{ backgroundColor: stageDot }} />
                    <span className="font-display font-black text-xs sm:text-sm text-ink uppercase tracking-wider">HPL • SEASON 2026</span>
                  </div>
                  <button onClick={() => setIsLoading(false)} className="px-3 py-1 rounded-full bg-[#FFFDF7] border-2 border-ink text-xs font-mono font-black shadow-sketch-sm cursor-pointer">
                    SKIP INTRO ➔
                  </button>
                </div>
                <div className="w-full h-2.5 bg-[#EAE2D0] rounded-full overflow-hidden border border-ink/20 p-[1px]">
                  <div className="h-full rounded-full bg-gradient-to-r from-[#4F46E5] via-[#7C3AED] to-[#F59E0B] transition-all duration-75" style={{ width: `${loadingProgress}%` }} />
                </div>
                <div className="font-mono text-xs font-black text-ink">✦ {Math.round(loadingProgress)}%</div>
              </div>

              {/* Storyboard Center Stage Canvas - No small card border */}
              <div className="relative w-full max-w-lg h-[380px] flex items-center justify-center my-auto">
                {/* 0-10%: Start */}
                {loadingProgress < 10 && (
                  <div className="relative flex flex-col items-center justify-center opacity-40">
                    <div className="text-4xl animate-pulse">✏️</div>
                    <div className="font-mono text-xs font-bold mt-2">&lt;code&gt; &#123; league &#125; fn()</div>
                  </div>
                )}

                {/* 10-30%: Trophy */}
                {loadingProgress >= 10 && loadingProgress < 30 && (
                  <div className="relative flex flex-col items-center justify-center animate-in zoom-in-95 duration-300">
                    <div className="text-7xl animate-pulse">🏆</div>
                    <div className="font-display font-black text-xl text-amber-700 mt-2 uppercase">CHAMPIONSHIP TROPHY</div>
                  </div>
                )}

                {/* 30-50%: HPL Shield */}
                {loadingProgress >= 30 && loadingProgress < 50 && (
                  <div className="relative flex flex-col items-center justify-center animate-in zoom-in-95 duration-300">
                    <div className="w-48 h-52 bg-[#FFFDF7] border-4 border-ink rounded-3xl flex flex-col items-center justify-center shadow-sketch-lg">
                      <div className="font-display font-black text-5xl text-ink">HPL</div>
                      <div className="font-mono font-black text-base text-[#4F46E5] mt-1">&lt; / &gt;</div>
                    </div>
                  </div>
                )}

                {/* 50-70%: Energy (Swashes, Rocket, Bulb, Doodles) */}
                {loadingProgress >= 50 && loadingProgress < 70 && (
                  <div className="relative w-full h-full flex items-center justify-center animate-in zoom-in-90 duration-300">
                    <div className="absolute top-4 right-8 text-4xl transform -rotate-45 animate-bounce">🚀</div>
                    <div className="absolute top-6 left-8 text-4xl animate-bounce">💡</div>
                    <div className="absolute bottom-6 left-12 bg-ink text-white px-2.5 py-1 rounded-xl text-xs font-mono font-bold">⚡ [ ~/code ]</div>
                    <div className="w-48 h-52 bg-ink text-white border-4 border-amber-400 rounded-3xl flex flex-col items-center justify-center shadow-sketch-xl">
                      <div className="font-display font-black text-5xl text-white">HPL</div>
                      <div className="font-mono font-black text-base text-amber-300 mt-1">&lt; / &gt;</div>
                    </div>
                  </div>
                )}

                {/* 70-90%: Teams Assembling */}
                {loadingProgress >= 70 && loadingProgress < 90 && (
                  <div className="relative w-full h-full flex items-center justify-center rounded-3xl overflow-hidden shadow-sketch-xl border-3 border-ink">
                    <img src="src/assets/hpl_hero_arena_1787762692893.jpg" className="w-full h-full object-cover" alt="Teams" />
                    <div className="absolute bottom-2 inset-x-2 bg-ink/90 text-white px-3 py-1.5 rounded-xl font-mono text-xs font-bold text-amber-300 text-center">
                      SQUADS ACTIVE • LAPTOPS ONLINE
                    </div>
                  </div>
                )}

                {/* 90-100%: Reveal */}
                {loadingProgress >= 90 && (
                  <div className="text-center space-y-3 animate-in zoom-in-90 duration-300">
                    <div className="text-4xl animate-bounce">🏆</div>
                    <h1 className="font-display font-black text-7xl text-ink leading-none">HPL</h1>
                    <div className="font-mono font-black text-sm tracking-widest text-[#4F46E5] uppercase">HACKATHON PREMIER LEAGUE</div>
                    <div className="pt-2">
                      <div className="px-7 py-2.5 rounded-full bg-[#EA580C] text-white font-display font-black text-base uppercase border-2 border-ink shadow-sketch animate-pulse inline-block">
                        THE LEAGUE BEGINS.
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Bottom Progression Text matching user specification */}
              <div className="inline-flex items-center gap-2 px-5 py-2 rounded-full bg-[#FFFDF7] border-2 border-ink shadow-sketch-sm">
                <span className="w-2.5 h-2.5 rounded-full animate-ping" style={{ backgroundColor: stageDot }} />
                <span className="font-mono text-xs sm:text-sm font-black text-ink tracking-wider uppercase">
                  {stageTxt}
                </span>
              </div>
            </div>
          )}
          {/* TOP NAVBAR (Matching media_1787841954823.png) */}
          <header className="sticky top-0 z-40 bg-[#FBF9F2]/95 backdrop-blur-md border-b-2 border-[#1E1B4B]/15">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              {/* Shield Logo */}
              <div className="flex items-center gap-3 cursor-pointer group">
                <div className="w-10 h-10 relative flex-shrink-0">
                  <svg viewBox="0 0 100 100" fill="none" className="w-full h-full transform group-hover:scale-105 transition-transform">
                    <polygon points="50,6 90,24 90,74 50,94 10,74 10,24" fill="#1E1B4B" stroke="#F59E0B" strokeWidth="4" />
                    <path d="M 30 38 L 40 54 L 50 34 L 60 54 L 70 38 L 68 62 H 32 Z" fill="#FBBF24" stroke="#D97706" strokeWidth="1.5" />
                    <rect x="36" y="64" width="28" height="5" rx="1.5" fill="#F59E0B" />
                  </svg>
                </div>
                <div>
                  <span className="text-xl font-black font-display tracking-tight text-ink uppercase block leading-none">HPL</span>
                  <span className="text-[8.5px] font-mono font-bold tracking-wider text-ink-muted uppercase leading-tight mt-0.5">
                    HACKATHON<br />PREMIER LEAGUE
                  </span>
                </div>
              </div>

              {/* Clean Nav Links with Active Orange Underline */}
              <nav className="hidden md:flex items-center gap-7 lg:gap-8">
                {[
                  { label: 'HOME', page: 'home' },
                  { label: 'ABOUT', page: 'league' },
                  { label: 'TIMELINE', page: 'timeline' },
                  { label: 'LEADERBOARD', page: 'leaderboard' },
                  { label: 'MENTORS', page: 'mentors' },
                  { label: 'SPONSORS', page: 'sponsors' },
                  { label: 'FAQ', page: 'faq' }
                ].map(item => {
                  const isActive = activePage === item.page;
                  return (
                    <div key={item.label} className="relative flex flex-col items-center">
                      <button
                        onClick={() => {
                          if (item.label === 'ABOUT') {
                            setActivePage('home');
                            setTimeout(() => {
                              const el = document.getElementById('about');
                              if (el) el.scrollIntoView({ behavior: 'smooth' });
                            }, 100);
                          } else {
                            setActivePage(item.page);
                          }
                        }}
                        className={`text-xs lg:text-[13px] font-display font-bold uppercase tracking-wider transition-colors cursor-pointer ${
                          isActive ? 'text-ink font-black' : 'text-ink/80 hover:text-ink'
                        }`}
                      >
                        {item.label}
                      </button>
                      {isActive && (
                        <span className="w-8 h-[3px] bg-amber-500 rounded-full mt-1.5" />
                      )}
                    </div>
                  );
                })}
              </nav>

              {/* Purple Pill Button */}
              <button
                className="px-6 py-2.5 rounded-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-display font-black text-xs xl:text-sm uppercase tracking-wider shadow-sm transition-all cursor-pointer flex items-center gap-1.5"
              >
                <span className="w-2 h-2 rounded-full bg-amber-300 animate-ping"></span>
                <span>REGISTER NOW</span>
              </button>
            </div>
          </header>

          {/* MAIN LANDING CONTENT */}
          <main className="w-full flex-grow space-y-12 lg:space-y-16">
            
            {/* 1. HERO SECTION */}
            <section className="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-10 pt-2 pb-6 lg:pt-4 lg:pb-8 overflow-hidden">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                
                {/* LEFT: Text Column */}
                <div className="lg:col-span-5 space-y-4 text-left z-20 relative lg:pr-2">
                  {/* League Season Live Pill */}
                  <div className="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-[#FFFDF7] border-2 border-ink font-mono text-[11px] font-black text-ink shadow-sketch-sm select-none cursor-default">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping" />
                    <span>SEASON 1 • 3-WEEK INNOVATION LEAGUE</span>
                  </div>

                  {/* Comic Brush Display Headline */}
                  <div className="space-y-0 select-none group">
                    <div className="font-marker text-5xl sm:text-6xl lg:text-7xl xl:text-[5.4rem] tracking-tight leading-[0.92] text-ink hover:translate-x-1 transition-transform">
                      CODE.
                    </div>
                    <div className="font-marker text-4xl sm:text-5xl lg:text-6xl xl:text-[4.7rem] tracking-tight leading-[0.94] text-[#4F46E5] animate-glow-purple hover:translate-x-1 transition-transform">
                      COLLABORATE.
                    </div>
                    <div className="font-marker text-5xl sm:text-6xl lg:text-7xl xl:text-[5.4rem] tracking-tight leading-[0.92] text-[#EA580C] animate-glow-orange hover:translate-x-1 transition-transform">
                      CONQUER.
                    </div>
                  </div>

                  {/* Subtitle */}
                  <div className="space-y-1 text-sm sm:text-base text-ink font-bold leading-snug">
                    <p>A 3-Week League of Innovation.</p>
                    <p className="text-ink/80 font-semibold">Build impactful solutions. Compete. Improve. Be the champion.</p>
                  </div>

                  {/* CTA Buttons */}
                  <div className="flex flex-wrap items-center gap-3 pt-1">
                    <button className="px-6 sm:px-7 py-3 sm:py-3.5 rounded-full bg-[#4F46E5] hover:bg-[#4338CA] text-white font-display font-black text-xs sm:text-sm uppercase tracking-wider sketch-border shadow-sketch hover:shadow-sketch-lg hover:-translate-y-0.5 transition-all cursor-pointer flex items-center gap-2">
                      <span>REGISTER NOW!</span>
                      <span className="text-base font-bold">&gt;</span>
                    </button>
                    <button className="px-6 sm:px-7 py-3 sm:py-3.5 rounded-full bg-[#FFFDF7] hover:bg-[#EFE8D6] text-ink font-display font-bold text-xs sm:text-sm uppercase tracking-wide sketch-border shadow-sketch hover:shadow-sketch-lg hover:-translate-y-0.5 transition-all cursor-pointer">
                      EXPLORE LEAGUE
                    </button>
                  </div>

                  {/* Date Badge: STARTS 2 SEPTEMBER 2026 */}
                  <div className="inline-flex items-center gap-2.5 px-4 py-2 rounded-xl bg-[#FFFDF7] border-2 border-ink font-display text-xs sm:text-sm font-bold text-ink shadow-sketch-sm w-fit">
                    <span className="text-[#4F46E5]">📅</span>
                    <span>STARTS 2 SEPTEMBER 2026 – 23 SEPTEMBER 2026</span>
                    <span className="text-xs font-mono px-2 py-0.5 rounded-md bg-amber-100 text-amber-900 font-bold ml-1">SMVITM</span>
                  </div>

                  {/* Mini Highlights Pill Strip */}
                  <div className="flex flex-wrap items-center gap-2 pt-0.5">
                    <span className="px-3 py-1 rounded-xl bg-[#FFFDF7] border border-ink text-[11px] font-mono font-black text-ink shadow-sketch-sm">
                      🏆 ₹30K PRIZE POOL
                    </span>
                    <span className="px-3 py-1 rounded-xl bg-[#FFFDF7] border border-ink text-[11px] font-mono font-black text-[#4F46E5] shadow-sketch-sm">
                      ⚔️ 8+ MATCH DAYS
                    </span>
                    <span className="px-3 py-1 rounded-xl bg-[#FFFDF7] border border-ink text-[11px] font-mono font-black text-[#EA580C] shadow-sketch-sm">
                      ⚡ TOP 4 PLAYOFFS
                    </span>
                  </div>
                </div>

                {/* RIGHT: Master Hero Illustration with Organic Vignette - Zero Text Overlap */}
                <div className="lg:col-span-7 flex items-center justify-center lg:justify-end w-full z-10 lg:-mr-4 xl:-mr-8">
                  <img
                    src="src/assets/hpl_hero_arena_1787762692893.jpg"
                    alt="HPL Hero Arena"

                      <button className="relative px-6 py-2.5 rounded-full bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-[#1E1B4B] font-display font-black text-xs uppercase tracking-wider shadow-sm flex items-center gap-2 cursor-pointer">
                        <span>🏆 REGISTER YOUR SQUAD</span>
                        <span>➔</span>
                      </button>
                    </div>
                  </div>

                  {/* Right Social & Partners */}
                  <div className="lg:col-span-4 flex flex-col items-center lg:items-end text-center lg:text-right gap-3">
                    <span className="font-mono text-[10px] font-black tracking-widest text-amber-400 uppercase">
                      ✦ CONNECT WITH LEAGUE
                    </span>
                    <div className="flex items-center gap-2">
                      <span className="w-8 h-8 rounded-xl bg-white/5 border border-white/15 flex items-center justify-center text-xs hover:scale-110 transition-transform cursor-pointer">📷</span>
                      <span className="w-8 h-8 rounded-xl bg-white/5 border border-white/15 flex items-center justify-center text-xs hover:scale-110 transition-transform cursor-pointer">💼</span>
                      <span className="w-8 h-8 rounded-xl bg-white/5 border border-white/15 flex items-center justify-center text-xs hover:scale-110 transition-transform cursor-pointer">🐙</span>
                      <span className="w-8 h-8 rounded-xl bg-white/5 border border-white/15 flex items-center justify-center text-xs hover:scale-110 transition-transform cursor-pointer">▶️</span>
                    </div>
                    <div className="flex flex-wrap items-center justify-center lg:justify-end gap-2 pt-1 text-[11px] font-display font-black text-white/80">
                      <span className="px-2 py-1 rounded bg-white/5 border border-white/10">🛡️ CodeTroopers</span>
                      <span className="px-2 py-1 rounded bg-white/5 border border-white/10">✨ IGNITE</span>
                      <span className="px-2 py-1 rounded bg-white/5 border border-white/10">🔺 AIKYA</span>
                      <span className="px-2 py-1 rounded bg-white/5 border border-white/10">⚡ IEEE</span>
                    </div>
                  </div>

                </div>

                <div className="pt-4 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] font-mono text-white/50 text-center sm:text-left">

          </footer>

          {/* FLOATING COMIC GLOVE SCROLL CONTROLLER */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col items-center gap-1 select-none">
            <button
              onClick={() => {
                if (window.scrollY > 300) {
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                  window.scrollBy({ top: window.innerHeight * 0.85, behavior: 'smooth' });
                }
              }}
              className="group relative flex flex-col items-center justify-center w-14 h-16 rounded-2xl bg-[#FFFDF7] border-2 border-[#1E1B4B] shadow-sketch hover:shadow-sketch-lg hover:-translate-y-1 active:translate-y-0.5 transition-all cursor-pointer p-1 overflow-hidden"
            >
              {/* Cartoon Glove Icon inside Button */}
              <div className="relative z-10 text-xl group-hover:scale-125 transition-transform duration-200">
                {window.scrollY > 300 ? '👆' : '👇'}
              </div>
              <div className="relative z-10 font-display font-black text-[10px] text-[#1E1B4B] flex items-center gap-0.5 mt-0.5">
                <span>SCROLL ↕</span>
              </div>
              {/* Burning Comic Fuse Spark */}
              <div className="absolute -top-1 -right-1 w-3 h-3 bg-[#F59E0B] rounded-full animate-ping opacity-75" />

            <span className="font-mono text-[9px] font-black uppercase tracking-wider text-white bg-[#1E1B4B] border border-[#1E1B4B] px-2 py-0.5 rounded-full shadow-sketch-sm">
              COMIC ↑

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
