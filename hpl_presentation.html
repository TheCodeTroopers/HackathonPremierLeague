    let currentSlide = 0;
    const totalSlides = slidesData.length;

    function renderSlide(index) {
      currentSlide = Math.max(0, Math.min(index, totalSlides - 1));
      const slide = slidesData[currentSlide];
      const container = document.getElementById('slideContent');
      container.style.opacity = '0';
      container.style.transform = 'translateY(6px)';

      setTimeout(() => {
        container.innerHTML = slide.render();
        lucide.createIcons();
        container.style.opacity = '1';
        container.style.transform = 'translateY(0)';
      }, 120);

      document.getElementById('slideCounter').innerText = `SLIDE ${String(currentSlide + 1).padStart(2, '0')} / ${String(totalSlides).padStart(2, '0')}`;
      document.getElementById('slideFooterCounter').innerText = `SLIDE ${currentSlide + 1} OF ${totalSlides}`;
      document.getElementById('progressBar').style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;

      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('prevBtn').style.opacity = currentSlide === 0 ? '0.4' : '1';
      document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
      document.getElementById('nextBtn').style.opacity = currentSlide === totalSlides - 1 ? '0.4' : '1';

      renderDots();
    }

    function renderDots() {
      const container = document.getElementById('dotsContainer');
      container.innerHTML = '';
      slidesData.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-3 rounded-full border border-[#1E1B4B] transition-all duration-300 ${
          currentSlide === idx 
            ? 'w-8 bg-amber-400 shadow-[2px_2px_0px_#1E1B4B]' 
            : 'w-3 bg-white hover:bg-amber-200'
        }`;
        dot.onclick = () => renderSlide(idx);
        container.appendChild(dot);
      });
    }

    function renderOverviewGrid() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = '';
      slidesData.forEach((slide, idx) => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl cursor-pointer border-2 transition-all transform hover:scale-102 ${
          currentSlide === idx 
            ? 'border-amber-400 bg-amber-500/30 shadow-[4px_4px_0px_#000]' 
            : 'border-white/20 bg-white/5 hover:border-white/40'
        }`;
        card.innerHTML = `
          <span class="text-xs font-mono font-black text-amber-400">SLIDE ${String(idx + 1).padStart(2, '0')}</span>
          <p class="mt-1 font-bold text-sm text-white line-clamp-2">${slide.title}</p>
        `;
        card.onclick = () => {
          renderSlide(idx);
          toggleOverview();
        };
        grid.appendChild(card);
      });
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) renderSlide(currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide > 0) renderSlide(currentSlide - 1);
    }

    function toggleOverview() {
      const modal = document.getElementById('overviewModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        renderOverviewGrid();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    }

     */

      const btnText = document.getElementById('downloadBtnText');
      try {
